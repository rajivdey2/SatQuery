<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SatQuery AI</title>
    <script>
      // Surface load/render failures instead of a silent blank page.
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root')
        if (r && !r.childElementCount && e.message) {
          r.innerHTML = '<div style="padding:24px;background:#2b1316;color:#e5484d;font:13px monospace;' +
            'border-bottom:1px solid #e5484d">[SatQuery] app failed to load: ' + e.message + '</div>'
        }
      }, true)
      setTimeout(function () {
        var r = document.getElementById('root')
        if (r && !r.childElementCount) {
          r.innerHTML = '<div style="padding:24px;background:#2b1316;color:#e5484d;font:13px monospace;' +
            'border-bottom:1px solid #e5484d">[SatQuery] app did not start. Open DevTools (F12) → Console and copy the error.</div>'
        }
      }, 5000)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
