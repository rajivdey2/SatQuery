# RS-VLM specialist LoRA config (matches published RS-VLM recipes, see CLAUDE.md).
model_id: Qwen/Qwen3-VL-4B-Instruct
peft:
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  freeze_vision: true          # keep vision tower + projector frozen
  freeze_embeddings: true
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true
training:
  epochs: 1
  lr: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch: 2
  grad_accum: 8
  max_seq_len: 4096
  max_pixels: 4194304          # sqrt-free pixel cap for the vision processor
  fp16: true
  bf16: false
  save_steps: 200
  logging_steps: 25
stages:
  - name: rsvqaxben          # bootstrap on BigEarthNet-derived VQA (domain adapt)
    data_dir: /kaggle/input/rsvqaxben
    epochs: 1
  - name: vrsbench_vqa_cap   # primary single-image SFT
    data_dir: /kaggle/input/vrsbench-split
    epochs: 1